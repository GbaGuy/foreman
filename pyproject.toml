[project]
name = "foreman"
version = "0.1.0"
description = "A terminal UI for running a crew of AI agents under an AI manager"
readme = "README.md"
authors = [
    { name = "guyb", email = "blumguy111@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
foreman = "foreman:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
