[package]
name = "foreman"
version = "0.1.0"
edition = "2024"
description = "A terminal UI where one Claude manager creates and directs a team of AI worker agents"
repository = "https://github.com/GbaGuy/foreman"
keywords = ["ai", "agents", "tui", "claude", "opencode"]
categories = ["command-line-utilities"]

[profile.release]
lto = true
strip = true

[dependencies]
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shlex = "2.0.1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
